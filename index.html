<!DOCTYPE html>
<html lang="pl">
<head>
  <link rel="icon" type="image/png" href="https://tajnachalupka.github.io/main/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tajna chałupka</title>
  
<style>
@font-face { font-family: "figtree"; src: url("https://tajnachalupka.github.io/main/Figtree.ttf"); }

body { margin:0; background:#191818; color:white; font-family: figtree, sans-serif;}

.hero { display:flex; justify-content:center; padding:15px 0; }
.hero img { width:160px; }

.section-block { width:min(100%,1000px); margin:0 auto; padding:0 9px; box-sizing:border-box;}

.section-title-img { display:block; width:100%; max-width:200px; margin:35px 0 20px 0;}

.auto-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:9px; justify-items:center; width:fit-content; margin:0 auto;}

.card { text-decoration:none; color:white; text-align:center; }
.card img { transition: filter .25s ease;}
.card:hover img { transform: none; filter: brightness(0.8);}


.card.square img { width:100%; max-width:150px; border-radius:2px; aspect-ratio:1/1; object-fit:cover;}

.card.tall img { width:100%; max-width:150px; aspect-ratio:5/9; object-fit:cover;}

@media(max-width:600px){
  .auto-grid { grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:9px; }
  .section-title-img { width:58%; }
}
</style>
</head>

<body>

<header class="hero">
  <img src="https://tajnachalupka.github.io/main/logo.png" alt="">
</header>

<!-- NOWE ROZDZIAŁY -->
<div class="section-block">
  <img class="section-title-img" src="https://tajnachalupka.github.io/main/nowy.png">

  <div id="titles-grid" class="auto-grid">

    <a class="card square" href="reader.html?comic=at&chapter=2">
      <img src="https://tajnachalupka.github.io/main/nr/afos60.jpg">
    </a>

    <a class="card square" href="reader.html?comic=at&chapter=2">
      <img src="https://tajnachalupka.github.io/main/nr/rc95.jpg">
    </a>

    <a class="card square" href="reader.html?comic=at&chapter=2">
      <img src="https://tajnachalupka.github.io/main/nr/sah6.jpg">
    </a>

    <a class="card square" href="reader.html?comic=at&chapter=2">
      <img src="https://tajnachalupka.github.io/main/nr/ub26c.jpg">
    </a>

    <a class="card square" href="reader.html?comic=at&chapter=2">
      <img src="https://tajnachalupka.github.io/main/nr/yiam11.jpg">
    </a>

    <a class="card square" href="reader.html?comic=afos&chapter=2">
      <img src="https://tajnachalupka.github.io/main/nr/yiam12.jpg">
    </a>

  </div>
</div>

<!-- WSZYSTKIE SERIE -->

  <img class="section-title-img" src="https://tajnachalupka.github.io/main/wszystkie.png">

  <div id="titles-grid-1" class="auto-grid">

    <a class="card tall" href="series.html?comic=afos">
      <img src="https://tajnachalupka.github.io/main/cov/!afos.jpg">

    <a class="card tall" href="series.html?comic=at">

    <a class="card tall" href="series.html?comic=mp">

    <a class="card tall" href="series.html?comic=mo">

    <a class="card tall" href="series.html?comic=osd">

<!-- OZNACZENIE 18+ -->
<div style="text-align:center; margin:40px 0;">
  <img src="https://tajnachalupka.github.io/main/info-i-18.png"
       style="max-width:470px; width:100%; height:auto;">
</div>

<script>
document.querySelectorAll("a.card").forEach(card => {
  const url = new URL(card.href, location.href);
  const comic = url.searchParams.get("comic");
  const chapter = url.searchParams.get("chapter");

  if (comic && chapter) {
    const key = `read_${comic}_${chapter}`;
    if (localStorage.getItem(key)) card.classList.add("read");
  }
});
</script>

</body>
</html>
