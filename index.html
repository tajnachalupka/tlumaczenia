body { margin:0; background:#191818; color:white; font-family: figtree, sans-serif;}

.section-block { width:min(100%,1000px); margin:0 auto;  padding:0 9px; box-sizing:border-box;}
.section-block1 { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap:558px; }
.section-block2 { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap:8px; }

.section-title-img { display:block; width:100%; max-width:200px; margin:35px 0 20px 0;}

.auto-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:3px; margin-bottom:0px; }
  
.card { text-decoration:none; color:white; text-align:center; }
.card img { transition: filter .25s ease; cursor: heart}
.card:hover img { transform: none; filter: brightness(0.8);}


.card.square img { width:100%; max-width:145px; border-radius:2px; aspect-ratio:1/1; object-fit:cover; }
.card.tall img { width:100%; max-width:130px; aspect-ratio:5/9; object-fit:cover; }
.card.title img { width: 100%; max-width: 190px; height: auto; object-fit: contain; }

@media(max-width:600px){
  .card.title img { max-width: 150px;}
  .card.square img { max-width: 113px;}
  .card.tall img { max-width: 113px;}
  .section-title-img { width: 58%; max-width:180px;}
}

<script>
document.querySelectorAll("a.card").forEach(card => {
  const url = new URL(card.href, location.href);
  const comic = url.searchParams.get("comic");
  const chapter = url.searchParams.get("chapter");

  if (comic && chapter) {
    const key = `read_${comic}_${chapter}`;
    if (localStorage.getItem(key)) card.classList.add("read");
  }
});
</script>
