<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✦⏖✦</title>
<link rel="icon" type="image/png" href="https://tajnachalupka.github.io/main/favicon.png">

<style>
@font-face{
  font-family:"figtree";
  src:url("https://tajnachalupka.github.io/main/Figtree.ttf") format("truetype");
}
body{
  margin:0;
  background:#191818;
  font-family:figtree,sans-serif;
}
#comic-container{
  max-width:720px;
  margin:0 auto;
}

/* FADE-IN */
.comic-page{
  width:100%;
  display:block;
  max-width:720px;
  image-rendering:-webkit-optimize-contrast;
  object-fit:contain;
  opacity:0;
  transition:opacity .35s ease;
}
.comic-page.loaded{
  opacity:1;
}

/* NAV BUTTONS */
.nav-buttons{
  position:fixed;
  bottom:20px;
  left:20px;
  display:flex;
  flex-direction:column;
  gap:6px;
  transition:opacity .15s;
}
.nav-buttons.hidden{
  opacity:0;
  pointer-events:none;
}
.nav-btn{
  height:50px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.btn-icon{
  width:30px;
  height:30px;
  filter:invert(1);
}

/* HEADER */
#series-header{
  position:fixed;
  top:7px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  transition:opacity .15s;
}
#series-img{
  max-height:23px;
}

/* REACTIONS */
#chapter_reactions{
  margin:40px auto;
  text-align:center;
}
.reactions-row{
  display:flex;
  justify-content:center;
  gap:7px;
}
.reaction-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  color:white;
  font-size:14px;
}
.reaction-btn{
  max-width:85px;
  max-height:100px;
  cursor:pointer;
  transition:transform .15s,opacity .2s;
}
.reaction-btn:hover{
  filter:brightness(.8);
}
.reaction-btn.clicked{
  opacity:.4;
  cursor:default;
}
.reaction-count{
  margin-top:4px;
}

@media(max-width:600px){
  .reaction-btn{
    max-width:80px;
    max-height:80px;
  }
  .reaction-count{
    font-size:12px;
  }
}

/* PADLET */
#comments_title{
  color:white;
  font-size:18px;
  text-align:center;
  margin:40px auto 20px;
  padding:12px;
  width:220px;
  background:#272727;
  border-radius:6px;
  cursor:pointer;
}
#comments_title:hover{
  background:#333;
}
#padlet_box{
  padding:10px;
  background:#191818;
  visibility:hidden;
  opacity:0;
  transition:opacity .1s;
  margin-top:30px;
}
.reaction-check {
  position: absolute;
  font-size: 34px;
  font-weight: 700;
  color: white;
  opacity: 0;
  transform: scale(0.4);
  animation: checkPop 0.45s ease-out forwards;
  pointer-events: none;
}

@keyframes checkPop {
  0% { opacity: 0; transform: scale(0.4); }
  40% { opacity: 1; transform: scale(1.25); }
  100% { opacity: 0; transform: scale(1); }
}
</style>
</head>

<body>

<!-- HEADER -->
<div id="series-header">
  <a id="series-link" href="#">
    <img id="series-img" src="">
  </a>
</div>

<!-- KOMIKS -->
<div id="comic-container"></div>
<p id="chapter_loading" style="margin-top:88px;color:white;text-align:center;">
  Ładuję rozdział...
</p>

<!-- NAWIGACJA -->
<div class="nav-buttons" id="nav">
  <div class="nav-btn" id="nextBtn">
    <img src="https://tajnachalupka.github.io/main/szczala-next.png" class="btn-icon">
  </div>
  <div class="nav-btn" id="prevBtn">
    <img src="https://tajnachalupka.github.io/main/szczala-prev.png" class="btn-icon">
  </div>
  <div class="nav-btn" id="homeBtn">
    <img src="https://tajnachalupka.github.io/main/domek.png" class="btn-icon">
  </div>
</div>

<!-- REAKCJE -->
<div id="chapter_reactions">
  <div class="reactions-row">
    <div class="reaction-item">
      <img class="reaction-btn" data-reaction="0"
           src="https://tajnachalupka.github.io/main/guziki-reakcji/r1.jpg">
      <div class="reaction-count">0</div>
    </div>
    <div class="reaction-item">
      <img class="reaction-btn" data-reaction="1"
           src="https://tajnachalupka.github.io/main/guziki-reakcji/r2.jpg">
      <div class="reaction-count">0</div>
    </div>
    <div class="reaction-item">
      <img class="reaction-btn" data-reaction="2"
           src="https://tajnachalupka.github.io/main/guziki-reakcji/r3.jpg">
      <div class="reaction-count">0</div>
    </div>
    <div class="reaction-item">
      <img class="reaction-btn" data-reaction="3"
           src="https://tajnachalupka.github.io/main/guziki-reakcji/r4.jpg">
      <div class="reaction-count">0</div>
    </div>
    <div class="reaction-item">
      <img class="reaction-btn" data-reaction="4"
           src="https://tajnachalupka.github.io/main/guziki-reakcji/r5.jpg">
      <div class="reaction-count">0</div>
    </div>
  </div>
</div>

<!-- PADLET -->
<p id="comments_title">Wyświetl komentarze<br>(uwaga na spoilery)</p>
<div id="padlet_box"></div>

<script>
(async function(){

  const qs = new URLSearchParams(location.search);
  const comicKey = qs.get("comic");
  const chapter = qs.get("chapter");
  const chapterDecoded = decodeURIComponent(chapter);
  const container = document.getElementById("comic-container");

  if(!comicKey || !chapter){
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Brak parametru.</p>";
    return;
  }

  // HOME
  document.getElementById("homeBtn").onclick = () => {
    location.href = "https://tajnachalupka.wixsite.com/tlumaczenia";
  };

  // JSON — pobieramy jako tekst, aby zachować kolejność kluczy
  let rawJson;
  try{
    rawJson = await fetch(`${comicKey}.json`).then(r => r.text());
  }catch(e){
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Błąd JSON.</p>";
    return;
  }

  const data = JSON.parse(rawJson);

  // HEADER SERII
  if(data.series_icon){
    document.getElementById("series-img").src = data.series_icon;
    document.getElementById("series-link").href =
      `series.html?comic=${comicKey}`;
  }

  const pages = data.chapters[chapterDecoded];
  if(!pages){
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Rozdział nie istnieje.</p>";
    return;
  }

  // ZAPIS PRZECZYTANIA — poprawiony
  localStorage.setItem(`read_${comicKey}_${chapterDecoded}`, "1");

  // PREFETCH
  let prefetchImg = null;

  function loadImage(i){
    return new Promise(resolve => {

      const img = document.createElement("img");
      img.className = "comic-page";

      img.onload = () => {
        img.classList.add("loaded");
        resolve(img);
      };

      img.onerror = () => {
        img.src = pages[i] + "?r=" + Date.now();
      };

      container.appendChild(img);
      img.src = pages[i];
    });
  }

  async function loadSequence(){
    const first = await loadImage(0);
    document.getElementById("chapter_loading")?.remove();

    if(pages[1]){
      prefetchImg = loadImage(1);
    }

    for(let i=1;i<pages.length;i++){
      let img;

      if(prefetchImg){
        img = await prefetchImg;
        prefetchImg = null;
      } else {
        img = await loadImage(i);
      }

      if(pages[i+1]){
        prefetchImg = loadImage(i+1);
      }
    }
  }

  loadSequence();

  // ⭐ WYCIĄGAMY KOLEJNOŚĆ ROZDZIAŁÓW Z SUROWEGO JSON ⭐
  const keys = [];
  rawJson.replace(/"chapters"\s*:\s*{([\s\S]*?)}/, (match, inner) => {
    inner.replace(/"([^"]+)"\s*:/g, (_, key) => {
      keys.push(key);
    });
  });

  const idx = keys.indexOf(chapterDecoded);

  document.getElementById("nextBtn").onclick = () => {
    if(idx < keys.length - 1){
      const next = keys[idx + 1];
      location.href =
        `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(next)}`;
    }else{
      location.href = "https://tajnachalupka.wixsite.com/tlumaczenia";
    }
  };

  document.getElementById("prevBtn").onclick = () => {
    if(idx > 0){
      const prev = keys[idx - 1];
      location.href =
        `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(prev)}`;
    }else{
      location.href = "https://tajnachalupka.wixsite.com/tlumaczenia";
    }
  };

  /* PADLET */
  let padletLoaded = false;
  document.getElementById("comments_title").onclick = () => {
    if (padletLoaded) return;
    padletLoaded = true;

    const box = document.getElementById("padlet_box");
    const embed = data.padlet;
    const full = embed.replace("/embed/", "/");

    box.innerHTML = `
      <div style="border:1px solid #0001; border-radius:2px; overflow:hidden; max-width:580px; margin:0 auto;">
        <iframe src="${embed}" frameborder="0" style="width:100%;height:600px;"></iframe>
        <p style="text-align:center; margin-top:14px;">
          <a href="${full}" target="_blank"
             style="padding:10px 18px; background:#272727; color:white; font-size:14px; border-radius:3px; text-decoration:none;">
            Otwórz padlet
          </a>
        </p>
      </div>
    `;

    document.getElementById("comments_title").style.display = "none";
    box.style.visibility = "visible";
    box.style.opacity = "1";
  };

})();
</script>

<!-- HIDE ON SCROLL -->
<script>
let lastScroll = 0;
const nav = document.getElementById("nav");
const header = document.getElementById("series-header");

window.addEventListener("scroll", () => {
  const y = window.scrollY;
  if (y > lastScroll) {
    nav.classList.add("hidden");
    header.style.opacity = "0";
  } else {
    nav.classList.remove("hidden");
    header.style.opacity = "1";
  }
  lastScroll = y;
});
</script>

<!-- STRZAŁKI -->
<script>
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") {
    document.getElementById("nextBtn").click();
  }
  if (e.key === "ArrowLeft") {
    document.getElementById("prevBtn").click();
  }
});
</script>

<!-- AUTO SCROLL -->
<script>
document.addEventListener("click", e => {
  const h = window.innerHeight;
  const y = e.clientY;

  if (!e.target.classList.contains("comic-page")) {
    return;
  }

  if (y > h * 0.25) {
    window.scrollBy({ top: h * 0.9 });
  }
});
</script>

<script type="module" src="reactions.js"></script>

</body>
</html>
